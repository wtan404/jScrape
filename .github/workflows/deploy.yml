name: Scheduled 12-Hour Scrape & Deploy

on:
  schedule:
    # Run every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  push:
    branches:
      - main
      - stage
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    name: Scrape Fresh Jobs & Sync to Live Site
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔍 Run Job Scraper & Link Verifier
        run: node scripts/scraper.js

      - name: 📊 Generate Health Telemetry
        run: |
          mkdir -p dta
          cat <<EOF > dta/health.json
          {
            "status": "healthy",
            "service": "scrapedeez",
            "updatedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "jobsCount": $(node -e "try { console.log(JSON.parse(require('fs').readFileSync('dta/jobs_data.json','utf8')).totalMatches || 0) } catch(e) { console.log(0) }"),
            "lastScraped": "$(node -e "try { console.log(JSON.parse(require('fs').readFileSync('dta/jobs_data.json','utf8')).lastScraped || '') } catch(e) { console.log('') }")"
          }
          EOF
          cp dta/health.json dta/health 2>/dev/null || true
          cp dta/health.json health.json 2>/dev/null || true
          cp dta/health.json health 2>/dev/null || true

      - name: 🎯 Determine target directory & URL
        id: set-target
        run: |
          BASE_DIR="${{ secrets.FTP_SERVER_DIR || './' }}"
          [[ "$BASE_DIR" != */ ]] && BASE_DIR="${BASE_DIR}/"
          if [ "${{ github.ref_name }}" = "stage" ]; then
            echo "dir=${BASE_DIR}stage/" >> $GITHUB_OUTPUT
            echo "url=https://stage.j.synopsdigital.com" >> $GITHUB_OUTPUT
            echo "exclude_htaccess=.htaccess" >> $GITHUB_OUTPUT
          else
            echo "dir=${BASE_DIR}" >> $GITHUB_OUTPUT
            echo "url=https://j.synopsdigital.com" >> $GITHUB_OUTPUT
            echo "exclude_htaccess=" >> $GITHUB_OUTPUT
          fi

      - name: 🔄 Signal Passenger restart
        run: |
          mkdir -p tmp
          touch tmp/restart.txt
          chmod +x scripts/*.sh ops/*.sh tests/*.sh 2>/dev/null || true

      - name: 🔀 Reconcile & Merge Live Upstream Application Statuses
        run: |
          node ops/merge_applications.js --upstream-url="${{ steps.set-target.outputs.url }}" || true

      - name: 🧹 Purge Remote Remnants & Legacy Artifacts
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ steps.set-target.outputs.dir }}
        run: |
          python3 ops/purge_remote_remnants.py || true

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.set-target.outputs.dir }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env*
            README.md
            dta/job_applications.json
            dta/profile.json
            job_applications.json
            profile.json
            stage/**
            ${{ steps.set-target.outputs.exclude_htaccess }}

      - name: 🧪 Run Automated Post-Deploy Verification
        run: |
          chmod +x tests/qa-check.sh
          echo "Waiting for passenger service to settle..."
          for i in {1..12}; do
            if curl -s -L -u "will:ScrapeDeez12!" "${{ steps.set-target.outputs.url }}/health" | grep -q "healthy"; then
              echo "Server health confirmed: application online."
              break
            fi
            sleep 2
          done
          sleep 2
          if [ "${{ github.ref_name }}" = "stage" ]; then
            ./tests/qa-check.sh "${{ steps.set-target.outputs.url }}" --mode=full
          else
            ./tests/qa-check.sh "${{ steps.set-target.outputs.url }}" --mode=audit
          fi
