name: Scheduled 12-Hour Scrape & Deploy

on:
  schedule:
    # Run every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  push:
    branches:
      - main
      - stage
      - qa
      - dev
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    name: Scrape Fresh Jobs & Sync to Live Site
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔍 Run Job Scraper & Link Verifier
        run: node scraper.js

      - name: 📊 Generate Health Telemetry
        run: |
          cat <<EOF > health.json
          {
            "status": "healthy",
            "service": "scrapedeez",
            "updatedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "jobsCount": $(node -e "try { console.log(JSON.parse(require('fs').readFileSync('jobs_data.json','utf8')).totalMatches || 0) } catch(e) { console.log(0) }"),
            "lastScraped": "$(node -e "try { console.log(JSON.parse(require('fs').readFileSync('jobs_data.json','utf8')).lastScraped || '') } catch(e) { console.log('') }")"
          }
          EOF
          cp health.json health

      - name: 🎯 Determine target directory & URL
        id: set-target
        run: |
          BASE_DIR="${{ secrets.FTP_SERVER_DIR || './' }}"
          [[ "$BASE_DIR" != */ ]] && BASE_DIR="${BASE_DIR}/"
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "dir=${BASE_DIR}dev/" >> $GITHUB_OUTPUT
            echo "url=https://dev.j.synopsdigital.com" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "qa" ]; then
            echo "dir=${BASE_DIR}qa/" >> $GITHUB_OUTPUT
            echo "url=https://qa.j.synopsdigital.com" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "stage" ]; then
            echo "dir=${BASE_DIR}stage/" >> $GITHUB_OUTPUT
            echo "url=https://stage.j.synopsdigital.com" >> $GITHUB_OUTPUT
          else
            echo "dir=${BASE_DIR}" >> $GITHUB_OUTPUT
            echo "url=https://j.synopsdigital.com" >> $GITHUB_OUTPUT
          fi

      - name: 🔄 Signal Passenger restart
        run: |
          mkdir -p tmp
          touch tmp/restart.txt
          chmod +x scripts/*.sh tests/*.sh 2>/dev/null || true

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.set-target.outputs.dir }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env*
            README.md
            dev/**
            qa/**
            stage/**
            .htaccess
            **/.htaccess

      - name: 🧪 Run Automated Post-Deploy Verification
        run: |
          chmod +x tests/qa-check.sh
          if [ "${{ github.ref_name }}" = "dev" ]; then
            ./tests/qa-check.sh "${{ steps.set-target.outputs.url }}" --mode=smoke
          elif [ "${{ github.ref_name }}" = "qa" ]; then
            ./tests/qa-check.sh "${{ steps.set-target.outputs.url }}" --mode=full
          else
            ./tests/qa-check.sh "${{ steps.set-target.outputs.url }}" --mode=audit
          fi
