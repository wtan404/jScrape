name: Scheduled 12-Hour Scrape & Deploy

on:
  schedule:
    # Run every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  push:
    branches:
      - main
      - stage
      - dev
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    name: Scrape Fresh Jobs & Sync to Live Site
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔍 Run Job Scraper & Link Verifier
        run: node scraper.js

      - name: 🎯 Determine target directory
        id: set-target
        run: |
          BASE_DIR="${{ secrets.FTP_SERVER_DIR || './' }}"
          [[ "$BASE_DIR" != */ ]] && BASE_DIR="${BASE_DIR}/"
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "dir=${BASE_DIR}dev/" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "stage" ]; then
            echo "dir=${BASE_DIR}stage/" >> $GITHUB_OUTPUT
          else
            echo "dir=${BASE_DIR}" >> $GITHUB_OUTPUT
          fi

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.set-target.outputs.dir }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env*
            README.md
            dev/**
            stage/**
            .htaccess
            **/.htaccess
