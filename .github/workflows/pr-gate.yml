name: Pre-Merge Quality Gate

on:
  pull_request:
    branches:
      - main
      - stage
      - dev

jobs:
  validate:
    name: Code Quality & Feed Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔍 Validate JavaScript Syntax
        run: |
          echo "Validating syntax across all Node.js modules..."
          node -c server.js
          node -c scripts/server.js
          node -c scripts/scraper.js
          node -c scripts/submission_engine.js
          node -c scripts/dashboard.js
          node -c ops/merge_applications.js
          echo "✅ All JavaScript files passed syntax verification."

      - name: 📊 Validate Configuration & Data Feeds
        run: |
          echo "Verifying dta/config.json, dta/jobs_data.json, and dta/profile.json formatting..."
          node -e 'JSON.parse(require("fs").readFileSync("dta/config.json")); console.log("✅ dta/config.json valid");'
          node -e 'JSON.parse(require("fs").readFileSync("dta/jobs_data.json")); console.log("✅ dta/jobs_data.json valid");'
          node -e 'JSON.parse(require("fs").readFileSync("dta/profile.json")); console.log("✅ dta/profile.json valid");'

      - name: 🧪 Pre-Merge Manifest & Structure Check
        run: |
          chmod +x tests/qa-check.sh
          echo "Checking manifest structure..."
          test -f sitemap.xml && echo "✅ sitemap.xml exists"
          test -f robots.txt && echo "✅ robots.txt exists"
