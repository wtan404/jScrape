---
deployment:
  tasks:
    - export DEPLOYPATH=/home/synopsdi/public_html/list/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R index.html $DEPLOYPATH
    - /bin/cp -R search.html $DEPLOYPATH
    - /bin/cp -R dashboard.js $DEPLOYPATH
    - /bin/cp -R dashboard_analytics.js $DEPLOYPATH
    - /bin/cp -R main.js $DEPLOYPATH
    - /bin/cp -R dashboard.html $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/dashboard
    - /bin/cp -R dashboard $DEPLOYPATH
    - /bin/cp -R styles.css $DEPLOYPATH
    - /bin/cp -R synops_logo.jpg $DEPLOYPATH
    - /bin/cp -R config.json $DEPLOYPATH
    - /bin/cp -R jobs_data.json $DEPLOYPATH
    - /bin/cp -R server.js $DEPLOYPATH
    - /bin/cp -R scraper.js $DEPLOYPATH
    - /bin/cp -R ats_scraper.js $DEPLOYPATH
    - /bin/cp -R verifier.js $DEPLOYPATH
    - /bin/cp -R geo_helper.js $DEPLOYPATH
    - /bin/cp -R google_jobs_scraper.js $DEPLOYPATH
    - /bin/cp -R zip3_centroids.js $DEPLOYPATH
    - /bin/cp -R submission_engine.js $DEPLOYPATH
    - /bin/cp -R package.json $DEPLOYPATH
    - /bin/cp -R profile.json $DEPLOYPATH
    - /bin/cp -R .htaccess $DEPLOYPATH 2>/dev/null || true
    - /bin/cp -R .htpasswd $DEPLOYPATH 2>/dev/null || true
    - /bin/mkdir -p $DEPLOYPATH/uploads/resumes
